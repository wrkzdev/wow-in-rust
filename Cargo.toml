[workspace]
resolver = "2"
members = [
    "crates/wow-crypto",
    "crates/wow-log",
    "crates/wow-serialize",
    "crates/wow-types",
    "crates/wow-randomwow",
    "crates/wow-consensus",
    "crates/wow-storage",
    "crates/wow-core",
    "crates/wow-p2p",
    "crates/wow-zmq",
    "crates/wow-rpc-types",
    "crates/wow-rpc-server",
    "crates/wow-wallet",
    "crates/wow-daemon-client",
    "crates/wow-tls",
    "bin/wownerod",
    "bin/wownero-wallet-cli",
    "bin/wownero-wallet-rpc",
]
# The GUI and web wallets are a workspace of their own (extras/Cargo.toml), so
# nothing here builds egui or wasm-bindgen.
exclude = ["extras"]

[workspace.package]
version = "0.11.4"
edition = "2021"
rust-version = "1.89"
license = "BSD-3-Clause"
repository = "https://github.com/wrkzdev/wow-in-rust"

[workspace.dependencies]
wow-crypto = { path = "crates/wow-crypto" }
wow-log = { path = "crates/wow-log" }
wow-serialize = { path = "crates/wow-serialize" }
wow-types = { path = "crates/wow-types" }
wow-randomwow = { path = "crates/wow-randomwow" }
wow-consensus = { path = "crates/wow-consensus" }
wow-storage = { path = "crates/wow-storage" }
wow-core = { path = "crates/wow-core" }
wow-p2p = { path = "crates/wow-p2p" }
wow-zmq = { path = "crates/wow-zmq" }
wow-rpc-types = { path = "crates/wow-rpc-types" }
wow-daemon-client = { path = "crates/wow-daemon-client" }
wow-wallet = { path = "crates/wow-wallet" }
wow-tls = { path = "crates/wow-tls" }

curve25519-dalek = { version = "4.1.3", default-features = false, features = ["alloc", "precomputed-tables", "zeroize"] }
subtle = { version = "2.5", default-features = false }
# Wiping key material and passwords when they go out of scope. "alloc" is
# what gives `Zeroizing<String>` and `Zeroizing<Vec<u8>>`, which is how a
# password read at a prompt is held.
zeroize = { version = "1.7", default-features = false, features = ["alloc"] }
lmdb-master-sys = "0.2"
libc = "0.2"
# IPv6-only listeners, so IPv4 and IPv6 can share a port (`wow-p2p::net`).
socket2 = "0.6"
# RPC over TLS (`wownerod`'s `rpc::tls`), and a wallet's TLS to a node
# (`wow-daemon-client`), on a rustls CryptoProvider made of pure-Rust
# RustCrypto crates (`wow-tls`): no C, C++ or assembly, so neither ring nor
# aws-lc-rs. All of one generation (digest 0.10, signature 2, rand_core 0.6):
# the one `rsa` 0.9, its stable release, uses.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["pem"] }
# The roots a wallet checks an https:// node's certificate against: Mozilla's,
# as data, so the check is the same on every system.
webpki-roots = "1.0"
sha2 = { version = "0.10", default-features = false, features = ["oid"] }
hmac = "0.12"
aes-gcm = { version = "0.10", default-features = false, features = ["aes"] }
chacha20poly1305 = { version = "0.10", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "pem", "std"] }
p384 = { version = "0.13", default-features = false, features = ["ecdh", "ecdsa", "pem", "std"] }
ed25519-dalek = { version = "2.2", default-features = false, features = ["std", "pkcs8", "zeroize"] }
x25519-dalek = { version = "2.0", default-features = false, features = ["precomputed-tables", "zeroize"] }
# Signing with RSA keys, which the C++ generates and users bring. Blinded, but
# not constant-time: RUSTSEC-2023-0071. See `wow-tls`'s provider.
rsa = { version = "0.9.10", default-features = false, features = ["pem", "std", "u64_digit"] }
rand_core = { version = "0.6", features = ["getrandom"] }
time = "0.3"
serde_json = "1.0"
thiserror = "1.0"
hex = "0.4"
# The node's console and the wallet's prompt: line editing, and up and down
# through the commands typed before. Without its default features: no history
# file (nothing typed at a wallet is written to disk), no custom key bindings,
# no home-directory lookup.
rustyline = { version = "18.0", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Tests iterate 5,545 crypto vectors and 10k block blobs; unoptimised ed25519 is
# too slow to keep the `cargo test` budget in 15 Sec 6 (< 5 min).
[profile.test.package."*"]
opt-level = 3
[profile.dev.package.curve25519-dalek]
opt-level = 3
# wow-crypto's CryptoNight verifies pre-RandomWOW proofs of work during a sync.
# Unoptimised that is seconds a block, which makes a debug `wownerod` unusable
# against a real chain and its peer-to-peer tests too slow to run.
[profile.dev.package.wow-crypto]
opt-level = 3
# RandomWOW is an interpreter in Rust now; unoptimised, one hash takes minutes
# and the Cache several, so a debug node could not follow the chain.
[profile.dev.package.wow-randomwow]
opt-level = 3
[profile.test.package.wow-randomwow]
opt-level = 3
# `package."*"` covers dependencies but not workspace members, and wow-crypto's
# own tests run CryptoNight: 2 MiB and ~2.6M AES rounds per vector. Unoptimised
# that is 22 s for four vectors.
[profile.test.package.wow-crypto]
opt-level = 3
