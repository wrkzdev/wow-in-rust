# CI per specs/15-testing-and-conformance.md §6.
#
# The jobs that need a synced C++ node (the full-resync differ, the interop
# matrix, the regtest functional suite) are M2/M3 work and are not wired up
# yet; the budgets from §6 are noted so they are not forgotten.

name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # specs/15 §6: "< 2 min"
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings

  # specs/15 §6: "< 5 min". Dominated by the 5,545 crypto vectors, which is why
  # the workspace pins opt-level = 3 for dependencies in the test profile.
  #
  # Includes the committed HF 18+ fixture, so the block-header signature rule
  # (specs/06 §4) is covered without generating the big corpus.
  test:
    name: unit tests + reference vectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # The wallet library also builds for a browser, where there are no sockets,
  # no OS entropy and no clock std can read. Checked, not tested: nothing here
  # runs under wasm.
  wasm:
    name: wallet library for wasm32
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --target wasm32-unknown-unknown -p wow-wallet -p wow-daemon-client

  # The GUI and web wallets, a workspace of their own under extras/. The desktop
  # build is checked and its unit tests run (none needs a display); the web
  # wallet is checked for wasm32.
  extras:
    name: GUI and web wallet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: extras
      # --locked: extras/Cargo.lock is committed, and CI is where a build that
      # ignored it would otherwise go unnoticed.
      - run: cargo check --locked --manifest-path extras/Cargo.toml -p wownero-wallet-gui
      - run: cargo test --locked --manifest-path extras/Cargo.toml -p wownero-wallet-gui --lib
      - run: cargo check --locked --manifest-path extras/Cargo.toml --target wasm32-unknown-unknown -p wownero-wallet-web

  # What is not Rust here, and is it still only what we chose? LMDB is
  # compiled on purpose -- data.mdb must stay byte-compatible with the C++
  # node -- and the desktop GUI's Wayland support brings one more
  # (docs/daemon-review.md §G). RandomWOW was a C++ submodule and ring was C
  # and assembly under the RPC TLS; both are Rust now. Nothing but a job like
  # this notices when a dependency bump brings a toolchain back, and by then
  # a cross-build is failing for reasons nobody asked for.
  no-c:
    name: only the C we chose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: no C, C++ or assembly sources in the tree
        run: |
          found=$(find . -path ./target -prune -o -path ./.git -prune -o \
            \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \
               -o -name '*.h' -o -name '*.hpp' -o -name '*.S' -o -name '*.asm' \) -print)
          if [ -n "$found" ]; then echo "$found"; exit 1; fi
      - name: no dependency compiles C that we did not choose
        run: bash scripts/check-no-c.sh

  # Guards against a silently truncated or swapped corpus: the M1 gate is only
  # meaningful if the vectors are the ones the reference tree ships.
  corpus-integrity:
    name: corpus integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tests/crypto/tests.txt is intact
        run: |
          test "$(wc -l < tests/corpus/crypto/tests.txt)" -eq 5545
          sha256sum -c tests/corpus/SHA256SUMS

  # specs/15 §2.2: the real M1 round-trip gate needs ~10k mainnet blocks, which
  # are generated rather than committed. Enable this once a daemon is reachable
  # from CI (a cached data directory is the intended shape -- see §3.1).
  #
  # mainnet-roundtrip:
  #   name: 10k-block round-trip
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: python scripts/fetch-corpus.py --daemon ${{ secrets.WOW_DAEMON }}
  #     - run: cargo test -p wow-types --test roundtrip
