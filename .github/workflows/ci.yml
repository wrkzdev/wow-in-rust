  # mainnet-roundtrip:
  #   name: 10k-block round-trip
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - run: python scripts/fetch-corpus.py --daemon ${{ secrets.WOW_DAEMON }}
  #     - run: cargo test -p wow-types --test roundtrip
