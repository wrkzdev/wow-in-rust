<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Scripts from this site only; requests to any node. Nothing inline runs. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self'; connect-src 'self' https: http:; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark light">
<title>Wownero Web Wallet</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1b1b; color: #e6e6e6; font: 15px/1.5 system-ui, sans-serif; }
  @media (prefers-color-scheme: light) { html, body { background: #f8f8f8; color: #222; } }
  #wallet { position: absolute; inset: 0; width: 100%; height: 100%; display: block; outline: none; }
  #status { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 16px; text-align: center; }
  #status small { display: block; max-width: 36em; margin-top: 8px; opacity: .8; }
</style>
</head>
<body>
<canvas id="wallet"></canvas>
<div id="status">
  <p>Loading the wallet…
    <small>This wallet is very new software. It has not been fully audited or tested. Use it at your own risk, with amounts you can afford to lose.</small>
  </p>
</div>
<noscript><p>This wallet runs in your browser, and needs JavaScript and WebAssembly.</p></noscript>
<script type="module" src="app.js"></script>
</body>
</html>
