[package]
name = "wownero-wallet-gui"
description = "A Wownero wallet with a GUI: the desktop application, and the interface the web wallet shares"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "wownero-wallet-gui"
path = "src/main.rs"

[dependencies]
wow-crypto = { path = "../../crates/wow-crypto" }
wow-daemon-client = { path = "../../crates/wow-daemon-client" }
wow-types = { path = "../../crates/wow-types" }
wow-wallet = { path = "../../crates/wow-wallet" }
wow-log = { path = "../../crates/wow-log" }

egui = "0.31"
# With its defaults: OpenGL through glow, and winit's X11 and Wayland, which are
# loaded at run time rather than linked, so a Linux build (a cross-build
# included) needs no system development packages. "persistence" keeps the
# settings: the node, the network, the folder. Never a password.
eframe = { version = "0.31", features = ["persistence"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
